<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #171019; overflow: hidden; overscroll-behavior: none; }
    a { color: #e8a33d; } a:hover { color: #f5c064; }
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    @keyframes fPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @keyframes fPop { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes fPopC { from { transform: translate(-50%, -10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  </style>
</helmet>
<div ref="{{ refWrap }}" data-screen-label="Frontier Game" style="position: fixed; inset: 0; background: #171019; overflow: hidden; touch-action: none; user-select: none; font-family: 'Press Start 2P', monospace; display: flex; align-items: center; justify-content: center;">
  <canvas ref="{{ refCanvas }}" style="image-rendering: pixelated; display: block;"></canvas>

  <div ref="{{ refJoyZone }}" style="position: absolute; left: 0; top: 0; bottom: 0; width: 55%; touch-action: none;">
    <div ref="{{ refJoyBase }}" style="display: none; position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(244,230,200,0.5); background: rgba(23,16,25,0.25); pointer-events: none;">
      <div ref="{{ refJoyKnob }}" style="position: absolute; left: 26px; top: 26px; width: 38px; height: 38px; border-radius: 50%; background: rgba(244,230,200,0.75); box-shadow: 0 3px 0 rgba(0,0,0,0.35);"></div>
    </div>
  </div>

  <sc-if value="{{ isGame }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; z-index: 4;">
      <button onPointerDown="{{ onSound }}" style="background: rgba(43,28,38,0.85); border: 3px solid #f2e3c2; color: #f7efdb; font-family: inherit; font-size: 7px; letter-spacing: 1px; padding: 8px 10px; border-radius: 8px; box-shadow: 0 3px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 40px;">{{ sndLabel }}</button>
      <button onPointerDown="{{ onPalette }}" style="background: rgba(43,28,38,0.85); border: 3px solid #f2e3c2; color: #e8a33d; font-family: inherit; font-size: 7px; letter-spacing: 1px; padding: 8px 10px; border-radius: 8px; box-shadow: 0 3px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 40px;">{{ paletteName }}</button>
    </div>

    <div style="position: absolute; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 4;">
      <sc-if value="{{ isPlacing }}" hint-placeholder-val="{{ false }}">
        <button onPointerDown="{{ onCancelPlace }}" style="background: rgba(96,40,40,0.9); border: 3px solid #e0705f; color: #f7efdb; font-family: inherit; font-size: 8px; letter-spacing: 1px; padding: 12px 14px; border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 44px;">CANCEL</button>
      </sc-if>
      <sc-if value="{{ notPlacing }}" hint-placeholder-val="{{ false }}">
        <button onPointerDown="{{ onCraftToggle }}" style="animation: {{ craftAnim }}; background: rgba(43,28,38,0.85); border: 3px solid #f2e3c2; color: #f7efdb; font-family: inherit; font-size: 8px; letter-spacing: 1px; padding: 12px 16px; border-radius: 10px; box-shadow: 0 4px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 48px;">CRAFT</button>
      </sc-if>
      <button ref="{{ refActionBtn }}" onPointerDown="{{ onAction }}" style="width: 92px; height: 92px; background: rgba(43,28,38,0.88); border: 4px solid #f2e3c2; color: #f7efdb; font-family: inherit; font-size: 10px; letter-spacing: 1px; border-radius: 16px; box-shadow: 0 5px 0 rgba(0,0,0,0.45); cursor: pointer; touch-action: manipulation;"><span ref="{{ refActionText }}">...</span></button>
    </div>
  </sc-if>

  <sc-if value="{{ craftOpen }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Craft Panel" style="position: absolute; left: 50%; bottom: 138px; transform: translateX(-50%); width: min(430px, calc(100vw - 20px)); background: rgba(30,20,28,0.96); border: 3px solid #f2e3c2; border-radius: 12px; padding: 12px; box-shadow: 0 8px 0 rgba(0,0,0,0.35); animation: fPop 0.18s ease-out; z-index: 5; box-sizing: border-box;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="color: #e8a33d; font-size: 9px; letter-spacing: 2px;">CRAFTING</span>
        <button onPointerDown="{{ onCraftToggle }}" style="background: rgba(244,230,200,0.1); border: 2px solid rgba(244,230,200,0.4); color: #f7efdb; font-family: inherit; font-size: 9px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer;">X</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{ recipes }}" as="rec" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; background: rgba(244,230,200,0.06); border: 2px solid rgba(244,230,200,0.18); border-radius: 8px; padding: 8px 10px;">
            <img src="{{ rec.icon }}" width="32" height="32" style="image-rendering: pixelated; flex-shrink: 0;" alt="">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
              <span style="color: #f7efdb; font-size: 8px;">{{ rec.name }}</span>
              <span style="color: rgba(247,239,219,0.45); font-size: 6px; letter-spacing: 1px;">{{ rec.desc }}</span>
              <div style="display: flex; gap: 9px; align-items: center;">
                <sc-for list="{{ rec.costs }}" as="cost" hint-placeholder-count="2">
                  <span style="display: inline-flex; align-items: center; gap: 3px;">
                    <img src="{{ cost.icon }}" width="14" height="14" style="image-rendering: pixelated;" alt="">
                    <span style="font-size: 7px; color: {{ cost.col }};">{{ cost.n }}</span>
                  </span>
                </sc-for>
              </div>
            </div>
            <button onPointerDown="{{ rec.onCraft }}" style="background: {{ rec.btnBg }}; color: {{ rec.btnCol }}; border: 2px solid {{ rec.btnBd }}; font-family: inherit; font-size: 8px; padding: 10px 8px; border-radius: 8px; cursor: pointer; min-width: 62px; min-height: 44px; flex-shrink: 0;">{{ rec.btnLabel }}</button>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ homeShown }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Home Banner" style="position: absolute; left: 50%; top: 15%; transform: translateX(-50%); background: rgba(30,20,28,0.95); border: 4px solid #e8a33d; border-radius: 14px; padding: 22px 26px; text-align: center; animation: fPopC 0.4s ease-out; z-index: 6; width: min(340px, calc(100vw - 40px)); box-sizing: border-box;">
      <div style="color: #e8a33d; font-size: 22px; margin-bottom: 12px; text-shadow: 3px 3px 0 rgba(0,0,0,0.4);">HOME.</div>
      <div style="color: #f7efdb; font-size: 8px; line-height: 1.9; margin-bottom: 16px;">THE CAMP IS YOURS.<br>LAYERS 1-3 COMPLETE.</div>
      <button onPointerDown="{{ onDismissHome }}" style="background: #e8a33d; color: #2b1c26; border: 3px solid #f2e3c2; font-family: inherit; font-size: 9px; letter-spacing: 1px; padding: 12px 16px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.4);">KEEP PLAYING</button>
    </div>
  </sc-if>

  <sc-if value="{{ isTitle }}" hint-placeholder-val="{{ true }}">
    <div data-screen-label="Title Screen" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, #241723 0%, #171019 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 10; padding: 20px; box-sizing: border-box; overflow: auto;">
      <div style="color: #f7efdb; font-size: clamp(26px, 7vw, 40px); letter-spacing: 4px; text-shadow: 4px 4px 0 #b3542e, 8px 8px 0 rgba(0,0,0,0.35);">FRONTIER</div>
      <div style="color: rgba(247,239,219,0.6); font-size: 8px; letter-spacing: 2px; text-align: center; line-height: 1.8;">A SETTLEMENT-SURVIVAL SLICE<br>LAYERS 1-3</div>
      <div style="color: #e8a33d; font-size: 8px; letter-spacing: 2px; margin-top: 6px;">CHOOSE YOUR WORLD</div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
        <sc-for list="{{ thumbs }}" as="th" hint-placeholder-count="3">
          <button onPointerDown="{{ th.pick }}" style="background: #241922; border: 3px solid {{ th.bd }}; border-radius: 10px; padding: 8px 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; align-items: center;">
            <img src="{{ th.url }}" width="140" height="84" style="image-rendering: pixelated; border-radius: 4px; display: block;" alt="">
            <span style="font-family: inherit; color: {{ th.col }}; font-size: 7px; letter-spacing: 1px;">{{ th.name }}</span>
          </button>
        </sc-for>
      </div>
      <button onPointerDown="{{ onStart }}" style="margin-top: 8px; background: #e8a33d; color: #2b1c26; border: 4px solid #f2e3c2; border-radius: 12px; font-family: inherit; font-size: 13px; letter-spacing: 2px; padding: 16px 34px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.45); animation: fPulse 2s infinite;">START</button>
      <div style="color: rgba(247,239,219,0.45); font-size: 7px; letter-spacing: 1px; line-height: 1.9; text-align: center;">MOVE: LEFT THUMB OR WASD &middot; ACT: BUTTON OR E<br>CRAFT: C &middot; SOUND: M</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;palette&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;meadow&quot;, &quot;harvest&quot;, &quot;dusk&quot;], &quot;default&quot;: &quot;meadow&quot;, &quot;tsType&quot;: &quot;'meadow' | 'harvest' | 'dusk'&quot;, &quot;section&quot;: &quot;World&quot; },
  &quot;sfx&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Game&quot; },
  &quot;showHints&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Game&quot; }
}">
class Component extends DCLogic {
  state = { phase: 'title', paletteKey: 'meadow', paletteName: '', muted: false, craftOpen: false, placing: null, recipes: [], craftPulse: false, homeShown: false, thumbs: [] };
  els = {};
  refWrap = el => { this.els.wrap = el; };
  refCanvas = el => { this.els.canvas = el; };
  refJoyZone = el => { this.els.joyZone = el; };
  refJoyBase = el => { this.els.joyBase = el; };
  refJoyKnob = el => { this.els.joyKnob = el; };
  refActionBtn = el => { this.els.actionBtn = el; };
  refActionText = el => { this.els.actionText = el; };

  async componentDidMount() {
    const m = await import('./v1/engine.js');
    if (this._dead) return;
    try { if (window.__frontierGame) window.__frontierGame.destroy(); } catch (e) {}
    this.game = m.createGame({
      els: this.els,
      props: { palette: this.props.palette, sfx: this.props.sfx, showHints: this.props.showHints },
      onUi: p => { if (!this._dead) this.setState(p); },
    });
    window.__frontierGame = this.game;
    this.setState({ thumbs: this.game.thumbs() });
  }
  componentWillUnmount() {
    this._dead = true;
    if (this.game) {
      this.game.destroy();
      if (window.__frontierGame === this.game) window.__frontierGame = null;
    }
  }
  componentDidUpdate(prev) {
    if (!this.game) return;
    if (prev.palette !== this.props.palette && this.props.palette) this.game.setPalette(this.props.palette);
    if (prev.sfx !== this.props.sfx) this.game.setMuted(!(this.props.sfx ?? true));
    if (prev.showHints !== this.props.showHints) this.game.setHints(this.props.showHints ?? true);
  }
  renderVals() {
    const s = this.state;
    const recipes = (s.recipes || []).map(r => ({
      ...r,
      onCraft: () => { if (this.game) this.game.craftItem(r.id); },
      btnLabel: r.done ? 'OWNED' : (r.can ? 'MAKE' : 'NEED'),
      btnBg: r.done ? 'rgba(143,208,106,0.18)' : (r.can ? '#e8a33d' : 'rgba(244,230,200,0.1)'),
      btnCol: r.done ? '#8fd06a' : (r.can ? '#2b1c26' : 'rgba(247,239,219,0.45)'),
      btnBd: r.can && !r.done ? '#f2e3c2' : 'rgba(244,230,200,0.25)',
      costs: (r.costs || []).map(c => ({ ...c, col: c.ok ? '#8fd06a' : '#e0705f' })),
    }));
    const thumbs = (s.thumbs || []).map(t => ({
      ...t,
      pick: () => { if (this.game) this.game.setPalette(t.key); },
      bd: t.key === s.paletteKey ? '#e8a33d' : '#4a3a44',
      col: t.key === s.paletteKey ? '#e8a33d' : 'rgba(247,239,219,0.7)',
    }));
    return {
      isTitle: s.phase === 'title',
      isGame: s.phase === 'game',
      craftOpen: !!s.craftOpen,
      homeShown: !!s.homeShown,
      isPlacing: !!s.placing,
      notPlacing: !s.placing,
      paletteName: s.paletteName || 'STYLE',
      sndLabel: s.muted ? 'SND OFF' : 'SND ON',
      craftAnim: s.craftPulse ? 'fPulse 1.1s infinite' : 'none',
      recipes, thumbs,
      refWrap: this.refWrap, refCanvas: this.refCanvas, refJoyZone: this.refJoyZone,
      refJoyBase: this.refJoyBase, refJoyKnob: this.refJoyKnob,
      refActionBtn: this.refActionBtn, refActionText: this.refActionText,
      onAction: e => { if (e && e.preventDefault) e.preventDefault(); if (this.game) this.game.action(); },
      onCraftToggle: () => { if (this.game) this.game.toggleCraft(); },
      onCancelPlace: () => { if (this.game) this.game.cancelPlace(); },
      onPalette: () => { if (this.game) this.game.cyclePalette(); },
      onSound: () => { if (this.game) this.game.toggleSound(); },
      onDismissHome: () => { if (this.game) this.game.dismissHome(); },
      onStart: () => { if (this.game) this.game.start(this.state.paletteKey); },
    };
  }
}
</script>
</body>
</html>
