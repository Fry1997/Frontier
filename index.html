<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Frontier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #171019; overflow: hidden; overscroll-behavior: none; }
  * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  #wrap {
    position: fixed; inset: 0; background: #171019; overflow: hidden;
    touch-action: none; user-select: none;
    font-family: 'Press Start 2P', monospace;
    display: flex; align-items: center; justify-content: center;
  }
  #game { image-rendering: pixelated; display: block; }

  .joy-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 55%; touch-action: none; }
  .joy-base {
    display: none; position: absolute; width: 96px; height: 96px; border-radius: 50%;
    border: 3px solid rgba(244,230,200,0.5); background: rgba(23,16,25,0.25); pointer-events: none;
  }
  .joy-knob {
    position: absolute; left: 26px; top: 26px; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(244,230,200,0.75); box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }

  @keyframes fPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes fPop  { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes fPopC { from { transform: translate(-50%, -10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .pulse { animation: fPulse 1.1s infinite; }

  .topbar { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; z-index: 4; }
  .chip-btn {
    background: rgba(43,28,38,0.85); border: 3px solid #f2e3c2; color: #f7efdb;
    font-size: 7px; letter-spacing: 1px; padding: 8px 10px; border-radius: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 40px;
  }
  .chip-btn.accent { color: #e8a33d; }

  .controls {
    position: absolute; right: 14px; bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end; z-index: 4;
  }
  .craft-btn {
    background: rgba(43,28,38,0.85); border: 3px solid #f2e3c2; color: #f7efdb;
    font-size: 8px; letter-spacing: 1px; padding: 12px 16px; border-radius: 10px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 48px;
  }
  .cancel-btn {
    background: rgba(96,40,40,0.9); border: 3px solid #e0705f; color: #f7efdb;
    font-size: 8px; letter-spacing: 1px; padding: 12px 14px; border-radius: 10px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4); cursor: pointer; min-height: 44px;
  }
  .action-btn {
    width: 92px; height: 92px; background: rgba(43,28,38,0.88); border: 4px solid #f2e3c2;
    color: #f7efdb; font-size: 10px; letter-spacing: 1px; border-radius: 16px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.45); cursor: pointer; touch-action: manipulation;
  }

  .craft-panel {
    position: absolute; left: 50%; bottom: 138px; transform: translateX(-50%);
    width: min(430px, calc(100vw - 20px)); background: rgba(30,20,28,0.96);
    border: 3px solid #f2e3c2; border-radius: 12px; padding: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.35); animation: fPop 0.18s ease-out; z-index: 5;
  }
  .cp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cp-head span { color: #e8a33d; font-size: 9px; letter-spacing: 2px; }
  .cp-close {
    background: rgba(244,230,200,0.1); border: 2px solid rgba(244,230,200,0.4); color: #f7efdb;
    font-size: 9px; width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
  }
  .cp-list { display: flex; flex-direction: column; gap: 8px; }
  .cp-row {
    display: flex; align-items: center; gap: 10px; background: rgba(244,230,200,0.06);
    border: 2px solid rgba(244,230,200,0.18); border-radius: 8px; padding: 8px 10px;
  }
  .cp-row img { image-rendering: pixelated; flex-shrink: 0; }
  .cp-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .cp-name { color: #f7efdb; font-size: 8px; }
  .cp-desc { color: rgba(247,239,219,0.45); font-size: 6px; letter-spacing: 1px; }
  .cp-costs { display: flex; gap: 9px; align-items: center; }
  .cp-cost { display: inline-flex; align-items: center; gap: 3px; font-size: 7px; }
  .cp-make {
    background: rgba(244,230,200,0.1); color: rgba(247,239,219,0.45); border: 2px solid rgba(244,230,200,0.25);
    font-size: 8px; padding: 10px 8px; border-radius: 8px; cursor: pointer; min-width: 62px; min-height: 44px; flex-shrink: 0;
  }
  .cp-make.can { background: #e8a33d; color: #2b1c26; border-color: #f2e3c2; }
  .cp-make.done { background: rgba(143,208,106,0.18); color: #8fd06a; }

  .home-banner {
    position: absolute; left: 50%; top: 15%; transform: translateX(-50%);
    background: rgba(30,20,28,0.95); border: 4px solid #e8a33d; border-radius: 14px;
    padding: 22px 26px; text-align: center; animation: fPopC 0.4s ease-out; z-index: 6;
    width: min(340px, calc(100vw - 40px));
  }
  .home-title { color: #e8a33d; font-size: 22px; margin-bottom: 12px; text-shadow: 3px 3px 0 rgba(0,0,0,0.4); }
  .home-sub { color: #f7efdb; font-size: 8px; line-height: 1.9; margin-bottom: 16px; }

  .primary-btn {
    background: #e8a33d; color: #2b1c26; border: 4px solid #f2e3c2; border-radius: 12px;
    font-size: 13px; letter-spacing: 2px; padding: 16px 34px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.45);
  }
  .ghost-btn {
    background: rgba(43,28,38,0.85); color: #f7efdb; border: 3px solid rgba(244,230,200,0.4);
    border-radius: 10px; font-size: 9px; letter-spacing: 1px; padding: 12px 18px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.4);
  }

  .title-screen {
    position: absolute; inset: 0; z-index: 10;
    background: radial-gradient(ellipse at 50% 30%, #241723 0%, #171019 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 20px; overflow: auto;
  }
  .t-logo {
    color: #f7efdb; font-size: clamp(26px, 7vw, 40px); letter-spacing: 4px;
    text-shadow: 4px 4px 0 #b3542e, 8px 8px 0 rgba(0,0,0,0.35);
  }
  .t-sub { color: rgba(247,239,219,0.6); font-size: 8px; letter-spacing: 2px; text-align: center; line-height: 1.8; }
  .t-label { color: #e8a33d; font-size: 8px; letter-spacing: 2px; margin-top: 6px; }
  .t-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .t-actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .t-hint { color: rgba(247,239,219,0.45); font-size: 7px; letter-spacing: 1px; line-height: 1.9; text-align: center; }
  .pick-card {
    background: #241922; border: 3px solid #4a3a44; border-radius: 10px; padding: 8px 10px 9px;
    cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center;
  }
  .pick-card img { image-rendering: pixelated; display: block; border-radius: 4px; }
  .pick-card span { color: rgba(247,239,219,0.7); font-size: 7px; letter-spacing: 1px; }
  .pick-card.picked { border-color: #e8a33d; }
  .pick-card.picked span { color: #e8a33d; }
</style>
</head>
<body>
<div id="wrap"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
